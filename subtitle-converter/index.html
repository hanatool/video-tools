<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0' name='viewport' />
    <meta name="description"
        content="Subtitle Converter - Convert and manage subtitle files easily and quickly online.">
    <meta name="keywords" content="subtitle converter, srt, vtt, subtitle tool, convert subtitle">
    <meta name="author" content="Subtitle Converter Tool">

    <title>Subtitle Converter</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-film text-primary me-2"></i>Subtitle Converter
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Tool</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Guide</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero / Description -->
    <section class="py-5 bg-white">
        <div class="container text-center">
            <h1 class="fw-bold">Subtitle Converter Online</h1>
            <p class="text-muted mt-3">
                Easily convert subtitle files between formats like SRT, VTT, and more.
                Fast, free, and simple to use on any device.
            </p>
            <button class="btn btn-primary mt-3">
                <i class="fa-solid fa-upload me-2"></i>Start Convert
            </button>
        </div>
    </section>

    <!-- Ad Section -->
    <section class="py-4">
        <div class="container">
            <div class="text-center mb-0">
                <script src="https://hanapha.com/banner/nativ.js"></script>
            </div>
        </div>
    </section>

    <!-- Tool Section -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">

                <!-- Upload Box -->
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3"><i class="fa-solid fa-file-arrow-up me-2"></i>Upload Subtitle</h5>

                            <input type="file" class="form-control mb-3" id="subtitleFile">

                            <select class="form-select mb-3" id="formatSelect">
                                <option value="srt">SRT</option>
                                <option value="vtt">VTT</option>
                                <option value="txt">TXT</option>
                            </select>

                            <button class="btn btn-success w-100" onclick="convertSubtitle()">
                                Convert Now
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Output Box -->
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3"><i class="fa-solid fa-file-lines me-2"></i>Output</h5>
                            <textarea class="form-control" rows="10" id="output"
                                placeholder="Converted subtitle will appear here..."></textarea>
                            <button class="btn btn-primary mt-3 w-100" onclick="downloadFile()">
                                Download Result
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0 text-muted">
                © <script type='text/javascript'>
                    var creditsyear = new Date();
                    document.write(creditsyear.getFullYear());
                </script> Subtitle Converter. All rights reserved.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script -->
    <script>
        function convertSubtitle() {
            const fileInput = document.getElementById('subtitleFile');
            const output = document.getElementById('output');

            if (!fileInput.files.length) {
                alert("Please upload a subtitle file first!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                let content = e.target.result;

                // Simple demo conversion (placeholder logic)
                const format = document.getElementById('formatSelect').value;

                if (format === "txt") {
                    content = content.replace(/[\d:\->,]/g, '');
                }

                output.value = content;
            };

            reader.readAsText(file);
        }

        function downloadFile() {
            const text = document.getElementById('output').value;

            if (!text) {
                alert("No content to download!");
                return;
            }

            const blob = new Blob([text], {
                type: "text/plain"
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "converted-subtitle.txt";
            link.click();
        }
    </script>

    <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>

</html>
