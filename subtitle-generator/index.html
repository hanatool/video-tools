<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0' name='viewport' />

    <title>Subtitle Generator</title>
    <meta name="description"
        content="Simple online subtitle generator tool to create SRT subtitles easily and quickly.">
    <meta name="keywords" content="subtitle generator, srt maker, video subtitles, text to subtitle">
    <meta name="author" content="Subtitle Generator Tool">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-closed-captioning text-primary me-2"></i>Subtitle Generator
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#tool">Tool</a></li>
                    <li class="nav-item"><a class="nav-link" href="#ads">Ads</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="py-5 text-center bg-white border-bottom">
        <div class="container">
            <h1 class="fw-bold">Subtitle Generator Tool</h1>
            <p class="text-muted mb-0">
                Create simple SRT subtitles from text instantly. Fast, clean, and easy to use.
            </p>
        </div>
    </header>

    <!-- TOOL -->
    <section id="tool" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h4 class="mb-3">Generate Subtitles</h4>

                            <label class="form-label">Enter text (one sentence per line)</label>
                            <textarea id="inputText" class="form-control mb-3" rows="6"
                                placeholder="Hello world&#10;This is subtitle generator&#10;Enjoy!"></textarea>

                            <button class="btn btn-primary w-100 mb-3" onclick="generateSRT()">
                                <i class="fa-solid fa-magic-wand-sparkles me-1"></i> Generate SRT
                            </button>

                            <label class="form-label">Output (SRT)</label>
                            <textarea id="outputText" class="form-control" rows="8" readonly></textarea>

                            <button class="btn btn-outline-success w-100 mt-3" onclick="downloadSRT()">
                                <i class="fa-solid fa-download me-1"></i> Download .srt
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- ADS BOTTOM -->
    <section class="py-3">
        <div class="container">
            <div class="text-center">
                <script src="https://hanapha.com/banner/nativ.js"></script>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-white border-top py-4 mt-4">
        <div class="container text-center">
            <p class="mb-0">© <script type='text/javascript'>
                    var creditsyear = new Date();
                    document.write(creditsyear.getFullYear());
                </script> Subtitle Generator. All rights reserved.</p>
        </div>
    </footer>

    <!-- SCRIPT -->
    <script>
        function generateSRT() {
            const text = document.getElementById("inputText").value.trim();
            const lines = text.split("\n");

            let output = "";
            let start = 0;

            lines.forEach((line, i) => {
                if (line.trim() === "") return;

                let end = start + 3;

                output += (i + 1) + "\n";
                output += formatTime(start) + " --> " + formatTime(end) + "\n";
                output += line + "\n\n";

                start = end;
            });

            document.getElementById("outputText").value = output;
        }

        function formatTime(seconds) {
            let h = String(Math.floor(seconds / 3600)).padStart(2, '0');
            let m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            let s = String(seconds % 60).padStart(2, '0');
            return `${h}:${m}:${s},000`;
        }

        function downloadSRT() {
            const content = document.getElementById("outputText").value;
            const blob = new Blob([content], {
                type: "text/plain"
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "subtitles.srt";
            link.click();
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>

</html>
