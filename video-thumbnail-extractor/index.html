<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0' name='viewport' />

  <title>Video Thumbnail Extractor</title>
  <meta name="description"
    content="Extract thumbnails from any video URL quickly and easily. Free online video thumbnail extractor tool.">
  <meta name="keywords" content="video thumbnail extractor, thumbnail generator, video tools, online tools">
  <meta name="author" content="Video Tools">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-film me-2"></i>Thumbnail Extractor
      </a>
    </div>
  </nav>

  <!-- Header -->
  <header class="py-5 text-center bg-white border-bottom">
    <div class="container">
      <h1 class="fw-bold">Video Thumbnail Extractor</h1>
      <p class="text-muted">Paste a video URL and extract thumbnails instantly</p>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container py-4">

    <div class="card shadow-sm border-0">
      <div class="card-body">

        <h5 class="mb-3"><i class="fa-solid fa-link me-2"></i>Enter Video URL</h5>

        <div class="input-group mb-3">
          <input type="text" id="videoUrl" class="form-control" placeholder="Paste YouTube or video URL here">
          <button class="btn btn-primary" onclick="extractThumbnail()">
            <i class="fa-solid fa-magnifying-glass"></i> Extract
          </button>
        </div>

        <div id="result" class="text-center mt-4"></div>

      </div>
    </div>

    <!-- Ad Space Bottom -->
    <div class="mt-4 text-center">
      <script src="https://hanapha.com/banner/nativ.js"></script>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-primary text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">© <script type='text/javascript'>
          var creditsyear = new Date();
          document.write(creditsyear.getFullYear());
        </script> Video Thumbnail Extractor. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script>
    function extractThumbnail() {
      const url = document.getElementById("videoUrl").value;
      const result = document.getElementById("result");

      if (!url) {
        result.innerHTML = '<div class="alert alert-danger">Please enter a video URL</div>';
        return;
      }

      // Simple YouTube thumbnail extractor
      let videoId = "";

      if (url.includes("youtube.com/watch?v=")) {
        videoId = url.split("v=")[1].split("&")[0];
      } else if (url.includes("youtu.be/")) {
        videoId = url.split("youtu.be/")[1];
      }

      if (!videoId) {
        result.innerHTML = '<div class="alert alert-warning">Unsupported URL format</div>';
        return;
      }

      const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

      result.innerHTML = `
    <div class="card border-0 shadow-sm mt-3">
      <div class="card-body">
        <h6 class="mb-3">Extracted Thumbnail</h6>
        <img src="${thumbnailUrl}" class="img-fluid rounded" alt="Thumbnail">
        <div class="mt-3">
          <a href="${thumbnailUrl}" target="_blank" class="btn btn-success">
            <i class="fa-solid fa-download me-1"></i> Open Image
          </a>
        </div>
      </div>
    </div>
  `;
    }
  </script>

  <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>

</html>
